[graph]
all-features = true

[advisories]
unmaintained = "all"
unsound = "all"
yanked = "deny"
ignore = [
    # chrono reaches the tree only through rmcp, whose schemars dependency always enables its
    # chrono04 feature; no rmcp release (3.11.0 and earlier) builds without it. Accepted on
    # 2026-11-23 until rmcp drops chrono: remove this entry then.
    { id = "RUSTSEC-2026-0543", reason = "unmaintained chrono comes only through rmcp, with no release that drops it" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
