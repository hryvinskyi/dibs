name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: scripts/check-domain-deps.sh
      - name: The agents' workflow text in every integration matches its source
        run: cargo xtask integrations --check

  client:
    name: client (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test the crates that run on a developer's machine
        shell: bash
        run: cargo test -p dibs-domain -p dibs-client -p dibs-agent-host -p 'dibs-host-*' -p dibs

  bench:
    name: hook speed (reported, not gated)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: A hook on a warm cache, process start included
        run: cargo bench -p dibs --bench warm_hook

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run typecheck
      - run: npm --prefix web test

  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Test the scripts
        run: |
          scripts/tests/check-clean.test.sh
          scripts/tests/check-host-names.test.sh
          scripts/tests/check-domain-deps.test.sh
          scripts/tests/install.test.sh
      - name: No agent host is named outside the adapters
        run: scripts/check-host-names.sh
      - name: No listed word appears in the tree or the history
        env:
          DIBS_DENYLIST: ${{ secrets.DIBS_DENYLIST }}
        run: scripts/check-clean.sh

  deploy:
    name: deploy files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: A certificate pair for the Caddyfiles to load
        run: |
          mkdir "$RUNNER_TEMP/certs"
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj /CN=dibs.example.com \
            -keyout "$RUNNER_TEMP/certs/key.pem" -out "$RUNNER_TEMP/certs/cert.pem"
      - name: Every Caddyfile is valid
        run: |
          for file in Caddyfile.example Caddyfile.cdn.example Caddyfile.auto.example; do
            echo "== $file"
            docker run --rm -e DIBS_HOST=dibs.example.com -e DIBS_PORT=443 \
              -v "$PWD/deploy/$file:/etc/caddy/Caddyfile:ro" \
              -v "$RUNNER_TEMP/certs:/certs:ro" \
              caddy:2 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          done
      - name: The compose example resolves
        run: |
          cp deploy/.env.example deploy/.env
          docker compose -f deploy/compose.example.yml config --quiet

  image:
    name: server image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build -f deploy/Dockerfile -t dibs-server:ci .
      - name: The container serves, creates a project and accepts its token
        run: |
          docker run -d --name dibs -p 127.0.0.1:8080:8080 -v dibs-data:/data dibs-server:ci
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/health
          token="$(docker exec dibs /dibs-server admin init --project widgets --admin alice --name Alice)"
          curl -fsS -H "Authorization: Bearer $token" http://127.0.0.1:8080/v1/me
      - name: The container's log
        if: failure()
        run: docker logs dibs
