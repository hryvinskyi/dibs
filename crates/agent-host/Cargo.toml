[package]
name = "dibs-agent-host"
description = "Host-neutral agent guard of dibs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
dibs-domain = { path = "../domain" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
time = "0.3.55"
unicode-general-category = "1.1.0"

[features]
# The conformance kit every adapter's tests run.
conformance = []

[dev-dependencies]
dibs-agent-host = { path = ".", features = ["conformance"] }
