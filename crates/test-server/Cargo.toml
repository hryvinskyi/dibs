[package]
name = "dibs-test-server"
description = "The dibs server run in-process on an ephemeral port, for the tests of its clients"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
axum = "0.8.9"
dibs-app = { path = "../app", features = ["fakes"] }
dibs-domain = { path = "../domain" }
dibs-server = { path = "../server" }
dibs-store-sqlite = { path = "../store-sqlite" }
serde_json = "1.0.154"
tempfile = "3.27.0"
time = { version = "0.3.55", features = ["macros"] }
tokio = { version = "1.54.0", features = ["rt-multi-thread", "net", "time"] }
