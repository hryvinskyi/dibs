[package]
name = "dibs"
description = "Command-line client of dibs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "dibs"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
dibs-client = { path = "../client" }
dibs-agent-host = { path = "../agent-host" }
dibs-host-claude-code = { path = "../host-claude-code" }
dibs-domain = { path = "../domain" }
clap = { version = "4.6.7", features = ["derive"] }
tokio = { version = "1.54.0", features = ["process", "rt", "signal", "sync", "time"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
gethostname = "1.1.0"
tracing = "0.1.44"
time = "0.3.55"
tracing-subscriber = { version = "0.3.23", features = ["fmt"] }
rmcp = { version = "3.5.1", features = ["server", "transport-io", "macros"] }
semver = "1.0.28"
rand = "0.10.3"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }

[dev-dependencies]
assert_cmd = "2.2.2"
criterion = "0.8.2"
dibs-test-server = { path = "../test-server" }
minisign = "0.10.0"
serde_json = "1.0.154"
tempfile = "3.27.0"
url = "2.5.8"

[[bench]]
name = "warm_hook"
harness = false

# The Claude Code hooks that stamp whether a session works or waits, measured through this binary.
# The source lives beside the adapter, the one crate that may name the host in code.
[[bench]]
name = "claude_code_hook"
path = "../host-claude-code/cli-benches/hook.rs"
harness = false

# The Claude Code hooks and the plugin's hook wrapper, run through this binary against the test
# server. The source lives beside the adapter, the one crate that may name the host in code.
[[test]]
name = "claude-code"
path = "../host-claude-code/cli-tests/main.rs"

[target."cfg(unix)".dependencies]
nix = { version = "0.31.3", default-features = false, features = ["signal"] }
