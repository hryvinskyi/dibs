[package]
name = "dibs-store-sqlite"
description = "SQLite store adapter of dibs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = "0.1.92"
dibs-app = { path = "../app" }
dibs-domain = { path = "../domain" }
serde = "1.0.229"
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "migrate", "macros"] }
thiserror = "2.0.21"
time = "0.3.55"

[dev-dependencies]
dibs-app = { path = "../app", features = ["fakes"] }
tempfile = "3.27.0"
tokio = { version = "1.54.0", features = ["rt", "rt-multi-thread", "macros", "time"] }
