<!--
  dibs: a static design reference of the web pages, over made-up data.

  Open it from a checkout of this repository (it reads the fonts under web/fonts by relative path);
  it needs no server and makes no request. The pages themselves are rendered by the server from
  crates/server/templates and styled by web/src/dibs.css, and they are the source of truth: where
  this file and they differ, they are right. The stylesheet below is a copy of web/src/dibs.css with
  its font addresses pointed at web/fonts. Every project, person, ticket, branch and sentence in the
  data is invented.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Now · widgets · dibs</title>
<style>
/* dibs.css — the only stylesheet. Fonts, tokens, base, the shell, the shared components, then one
   section per screen between its markers. A page without scripts keeps every section visible. */

/* ── Fonts: IBM Plex, Latin-1 subsets, served beside this file ───── */

  unicode-range: U+0000, U+000D, U+0020-007E, U+00A0-00FF, U+0131, U+0152-0153, U+02C6, U+02DA, U+02DC, U+2013-2014, U+2018-201A, U+201C-201E, U+2020-2022, U+2026, U+2030, U+2039-203A, U+2044, U+20AC, U+2122, U+2212, U+FB01-FB02;

@font-face {

  src: url("../../web/fonts/IBMPlexMono-Medium-Latin1.woff2") format("woff2");
  unicode-range: U+0020-007E, U+00A0-00FF, U+0131, U+0152-0153, U+02C6, U+02DA, U+02DC, U+2013-2014, U+2018-201A, U+201C-201E, U+2020-2022, U+2026, U+2030, U+2039-203A, U+2044, U+20AC, U+2122, U+2212, U+FB01-FB02;
}
@font-face {
  font-family: "IBM Plex Mono"; font-style: normal; font-weight: 600; font-display: swap;
  src: url("../../web/fonts/IBMPlexMono-SemiBold-Latin1.woff2") format("woff2");
  unicode-range: U+0020-007E, U+00A0-00FF, U+0131, U+0152-0153, U+02C6, U+02DA, U+02DC, U+2013-2014, U+2018-201A, U+201C-201E, U+2020-2022, U+2026, U+2030, U+2039-203A, U+2044, U+20AC, U+2122, U+2212, U+FB01-FB02;
}

/* ── Tokens: every colour is a token; dark follows the system setting ───── */
:root {
  color-scheme: light;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --bg: #f6f5fa; --rail: #eeedf5; --surface: #ffffff; --sunk: #f1f0f7;
  --line: #e2e0ec; --line-2: #cbc8dc;
  --text: #17162a; --text-2: #55546b; --text-3: #6f6e88;
  --accent: #6a3de0; --accent-soft: #ece6ff; --on-accent: #ffffff;
  --ok: #17803f; --warn: #a15c07; --warn-soft: #fdf0d5; --danger: #c0271d; --danger-soft: #fde6e3;
  --p1: #2f62e0; --p2: #0e8a82; --p3: #c2317d; --p4: #a15c07; --p5: #6a3de0; --p6: #3c7a1e;
  --shadow: 0 1px 2px rgb(23 22 42 / .06); --float: 0 18px 50px rgb(23 22 42 / .22);
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #111119; --rail: #0c0c13; --surface: #181822; --sunk: #14141d;
    --line: #262635; --line-2: #3a3a50;
    --text: #eceaf6; --text-2: #a8a6bd; --text-3: #8583a0;
    --accent: #a78bfa; --accent-soft: #261f47; --on-accent: #14121f;
    --ok: #4ad67f; --warn: #f5b942; --warn-soft: #33270c; --danger: #f87b70; --danger-soft: #3a1614;
    --p1: #74a2ff; --p2: #41cfc3; --p3: #f07ab4; --p4: #f5b942; --p5: #a78bfa; --p6: #8fd35f;
    --shadow: 0 1px 2px rgb(0 0 0 / .4); --float: 0 18px 60px rgb(0 0 0 / .6);
  }
}

/* ── Base ───────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 400 14px/1.45 var(--sans); -webkit-font-smoothing: antialiased; }
h1, h2, h3, p, ul, ol, dl, dd { margin: 0; padding: 0; } ul, ol { list-style: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.skip { position: absolute; left: 8px; top: -100px; z-index: 30; padding: 8px 12px; background: var(--surface); border: 1px solid var(--line-2); border-radius: 6px; }
.skip:focus { top: 8px; }
.visually-hidden { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.mono { font-family: var(--mono); font-size: 12px; }
.label { font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--text-3); }
.dim { color: var(--text-2); } .faint { color: var(--text-3); }
.pc-1 { --pc: var(--p1); } .pc-2 { --pc: var(--p2); } .pc-3 { --pc: var(--p3); } .pc-4 { --pc: var(--p4); } .pc-5 { --pc: var(--p5); } .pc-6 { --pc: var(--p6); }

/* ── Links: an in-app link underlines on hover, an outside one is the arrow beside the name ───── */
.lnk:hover, .ref a:hover, .who:hover b, .br a:hover, .file:hover { text-decoration: underline; text-underline-offset: 2px; }
.ref { font: 500 12px var(--mono); color: var(--text-2); white-space: nowrap; }
.ref i { font-style: normal; color: var(--text-3); font-weight: 400; }
.ext { margin-left: 3px; font: 500 12px var(--sans); color: var(--text-3); }
.ext:hover { color: var(--accent); }
.who { display: inline-flex; align-items: center; gap: 6px; }
.who b { font-weight: 500; }
.area { padding: 0 6px; border-radius: 4px; background: var(--sunk); font: 400 11.5px/1.7 var(--mono); color: var(--text-2); white-space: nowrap; }
a.area:hover { color: var(--accent); }
.br { font: 400 12px var(--mono); color: var(--text-2); overflow-wrap: anywhere; }
.file { font: 400 12px var(--mono); color: var(--text-2); overflow-wrap: anywhere; }

/* ── Shell: the rail always shows search, people, slots and worktrees; the centre pane holds the view ───── */
.app { display: grid; grid-template-columns: 272px minmax(0, 1fr); height: 100%; }
.rail { display: flex; flex-direction: column; gap: 20px; padding: 16px 12px; background: var(--rail); border-right: 1px solid var(--line); overflow-y: auto; }
.rail > * { flex-shrink: 0; }
.brand { display: flex; align-items: baseline; gap: 8px; padding: 2px 8px 0; }
.brand b { font: 600 19px/1 var(--mono); letter-spacing: -.03em; }
.brand b::after { content: "."; color: var(--accent); }
.brand span span { color: var(--text-3); font-size: 13px; }
.rail form[data-search] { position: relative; display: flex; align-items: center; gap: 8px; width: 100%; height: 34px; padding: 0 10px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--surface); color: var(--text-3); font-size: 13px; }
.rail form[data-search]:hover { border-color: var(--text-3); color: var(--text-2); }
.rail form[data-search]:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.searchbtn { flex: 1; min-width: 0; height: 100%; padding: 0; border: 0; border-radius: 0; background: none; color: var(--text); font: inherit; font-size: 13px; outline: none; appearance: none; -webkit-appearance: none; }
.searchbtn::placeholder { color: var(--text-3); opacity: 1; }
.searchbtn::-webkit-search-cancel-button { display: none; }
kbd { margin-left: auto; padding: 0 5px; border: 1px solid var(--line-2); border-radius: 4px; font: 500 11px var(--mono); color: var(--text-3); }
.rail form[data-search] kbd { pointer-events: none; }
.rail h3 { padding: 0 8px 6px; }
.nav a, .ppl a { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 7px; color: var(--text-2); font-weight: 500; }
.nav a:hover, .ppl a:hover { background: var(--line); color: var(--text); }
.nav a[aria-current="page"], .ppl a[aria-current="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
.nav .k, .ppl .k { margin-left: auto; font: 500 12px var(--mono); color: var(--text-3); white-space: nowrap; }
.nav .k--hot { padding: 0 7px; border-radius: 99px; background: var(--accent); color: var(--on-accent); font-weight: 600; }
.ppl a > span:nth-child(2) { min-width: 0; }
.ppl small { display: block; font: 400 11px var(--mono); color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.av { flex: none; display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; font: 600 10px var(--sans); letter-spacing: .02em; color: var(--pc); background: color-mix(in srgb, var(--pc) 18%, transparent); }
.av--s { width: 18px; height: 18px; font-size: 9px; }
.slots summary { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; align-items: center; gap: 8px; padding: 4px 8px; border-radius: 6px; font: 400 12px var(--mono); color: var(--text-3); cursor: pointer; list-style: none; }
.slots summary::-webkit-details-marker { display: none; }
.slots summary:hover { background: var(--line); }
.slots summary::before { content: ""; width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--line-2); }
.slots .held summary { color: var(--text); } .slots .held summary::before { background: var(--p2); border-color: var(--p2); }
.slots summary span:last-child { font-family: var(--sans); }
.slots summary span:first-of-type { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.slots p { margin: 2px 8px 8px 26px; font-size: 12px; color: var(--text-2); overflow-wrap: anywhere; }
.wts li { display: grid; gap: 1px; padding: 4px 8px 4px 26px; position: relative; font-size: 12px; color: var(--text-2); }
.wts li::before { content: ""; position: absolute; left: 9px; top: 9px; width: 7px; height: 7px; border-radius: 50%; background: var(--p1); }
.wts b { font: 500 12px var(--mono); color: var(--text); }
.rail__foot { margin-top: auto; display: flex; align-items: center; gap: 8px; padding: 0 8px; font-size: 12px; color: var(--text-3); }
.rail__foot button { margin-left: auto; color: var(--text-2); }
.rail [data-rail-toggle] { display: none; }

.main { display: grid; grid-template-columns: minmax(0, 1fr); min-height: 0; }
.main.split { grid-template-columns: minmax(0, 1fr) 440px; }
.pane { overflow-y: auto; min-width: 0; }
.insp { border-left: 1px solid var(--line); background: var(--surface); overflow-y: auto; min-width: 0; }

/* ── State marks: a filled dot works, a ringed one waits in review, a dashed one went silent ───── */
.s { flex: none; width: 10px; height: 10px; border-radius: 50%; }
.s--working { background: var(--ok); }
.s--review { border: 3px solid var(--accent); }
.s--stale { border: 1.5px dashed var(--warn); }

/* ── Tags and buttons ───────────────────────────────── */
.tag { display: inline-flex; align-items: center; gap: 5px; padding: 0 8px; border-radius: 99px; font-size: 11.5px; font-weight: 500; line-height: 1.75; background: var(--sunk); color: var(--text-2); white-space: nowrap; }
.tag--warn { background: var(--warn-soft); color: var(--warn); }
.tag--bad { background: var(--danger-soft); color: var(--danger); }
.tag--review { background: var(--accent-soft); color: var(--accent); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 30px; padding: 0 12px; border: 1px solid var(--line-2); border-radius: 7px; background: var(--surface); font-size: 13px; font-weight: 500; white-space: nowrap; }
.btn:hover { border-color: var(--text-3); }
.btn--pri { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.btn--warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
.btn--small { height: 24px; padding: 0 9px; border-radius: 6px; font-size: 12px; }

/* ── Forms ──────────────────────────────────────────── */
.field { display: grid; gap: 6px; align-content: start; min-width: 0; }
.field label { font-size: 13px; font-weight: 500; }
.field .hint { font-size: 12px; color: var(--text-3); }
.input, .textarea { width: 100%; padding: 0 10px; border: 1px solid var(--line-2); border-radius: 7px; background: var(--surface); color: var(--text); font: inherit; font-size: 13px; }
.input { height: 34px; }
.input.mono { font-family: var(--mono); font-size: 13px; }
.textarea { min-height: 64px; padding: 8px 10px; background: var(--bg); resize: vertical; }
.input:focus-visible, .textarea:focus-visible { outline-offset: 0; border-color: var(--accent); }
[aria-invalid="true"] { border-color: var(--danger); }
.check { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; }
.check input { width: 16px; height: 16px; margin: 0; accent-color: var(--accent); }

/* ── Rows: lists of things, one line each ───────────── */
.bar-top { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; padding: 12px 24px; background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.bar-top h1 { font-size: 18px; font-weight: 600; letter-spacing: -.01em; margin-right: 4px; }
.seg { display: inline-flex; flex-wrap: wrap; padding: 2px; border-radius: 8px; background: var(--sunk); border: 1px solid var(--line); }
.seg a { padding: 3px 10px; border-radius: 6px; font-size: 13px; font-weight: 500; color: var(--text-2); white-space: nowrap; }
.seg a[aria-current="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
.seg .k { margin-left: 5px; font: 400 11px var(--mono); color: var(--text-3); }
.search { margin-left: auto; height: 30px; width: 272px; max-width: 100%; padding: 0 10px; border: 1px solid var(--line-2); border-radius: 7px; background: var(--surface); color: var(--text); font: inherit; font-size: 13px; }
.grp { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 18px 24px 6px; }
.grp .r { margin-left: auto; font-size: 12px; color: var(--text-3); }
.row { position: relative; display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; align-items: center; gap: 14px; padding: 9px 24px; }
.row:hover { background: var(--sunk); }
.row[aria-current="true"] { background: var(--accent-soft); }
.row__t { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.row__t::after { content: ""; position: absolute; inset: 0; }
.row a:not(.row__t), .row .ext { position: relative; z-index: 1; }
.row__m { display: flex; gap: 8px; align-items: center; margin-top: 2px; font-size: 12px; color: var(--text-3); overflow: hidden; white-space: nowrap; }
.row__e { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-3); white-space: nowrap; }
.row__e .age { min-width: 38px; text-align: right; font-family: var(--mono); }
.row__e .age--long { color: var(--warn); font-weight: 600; }
.pri { display: inline-grid; place-items: center; width: 26px; height: 18px; border-radius: 4px; font: 600 11px var(--mono); background: var(--sunk); color: var(--text-3); }
.pri--1 { background: var(--warn-soft); color: var(--warn); }
.note { padding: 14px 24px 40px; color: var(--text-3); font-size: 13px; }
.more { display: block; padding: 8px 24px; font-size: 13px; font-weight: 500; color: var(--accent); }
.sec { display: grid; gap: 12px; }
.sec__head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.sec__head h2 { font-size: 15px; font-weight: 600; }
.sec__head p { color: var(--text-3); font-size: 13px; }
.lines li { display: flex; align-items: baseline; gap: 10px; padding: 3px 0; min-width: 0; font-size: 13px; }
.lines .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-2); }
.lines .e { font: 400 12px var(--mono); color: var(--text-3); white-space: nowrap; }
.rule { padding-top: 10px; border-top: 1px dashed var(--line-2); font-size: 12.5px; color: var(--text-2); }
.empty { display: grid; place-items: center; height: 100%; padding: 40px; text-align: center; color: var(--text-3); }

/* ── Inspector: one object and every link that leads from it ───── */
.insp__in { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; padding: 18px 22px 32px; }
.insp__in > *, .blk > *, .callout > * { min-width: 0; }
.insp__top { display: flex; align-items: center; gap: 10px; }
.insp__top .r { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.insp__top .x { color: var(--text-3); font-size: 20px; line-height: 1; padding: 2px 4px; }
.mini { font-size: 12px; font-weight: 500; color: var(--accent); }
.insp h2 { font-size: 19px; font-weight: 600; letter-spacing: -.015em; line-height: 1.3; text-wrap: balance; }
.kv { display: grid; grid-template-columns: 104px minmax(0, 1fr); gap: 8px 12px; font-size: 13px; }
.kv dt { color: var(--text-3); } .kv dd { display: flex; align-items: center; gap: 4px 8px; flex-wrap: wrap; min-width: 0; }
.blk { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
.rowlist li { display: flex; align-items: baseline; gap: 8px; padding: 6px 0; border-top: 1px solid var(--line); font-size: 13px; min-width: 0; }
.rowlist li:first-child { border-top: 0; }
.rowlist .r { margin-left: auto; font-size: 12px; color: var(--text-3); white-space: nowrap; }
.rowlist .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-2); }

/* ── Callouts ───────────────────────────────────────── */
.callout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; padding: 14px; border-radius: 10px; background: var(--warn-soft); font-size: 13px; }
.callout b { color: var(--warn); font-weight: 600; }
.callout--bad { background: var(--danger-soft); } .callout--bad b { color: var(--danger); }
.callout--info { background: var(--accent-soft); } .callout--info b { color: var(--accent); }
.callout .acts { display: flex; flex-wrap: wrap; gap: 8px; }
.moved li { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 10px; padding: 5px 0; border-top: 1px solid color-mix(in srgb, var(--warn) 22%, transparent); }
.moved li:first-child { border-top: 0; }
.moved .files { display: grid; gap: 1px; }
.cmd { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 7px; background: var(--sunk); font: 400 12px var(--mono); }
.cmd span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cmd button { color: var(--accent); font: 600 12px var(--sans); }

/* ── Conversation: messages, who acknowledged, the reply form ───── */
.msg { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; font-size: 13px; }
.msg time { color: var(--text-3); font-size: 12px; margin-left: 6px; }
.msg p { color: var(--text-2); margin-top: 3px; overflow-wrap: anywhere; }
.msg--high, .msg--urgent { padding-left: 10px; border-left: 3px solid var(--warn); }
.msg--urgent { border-left-color: var(--danger); }
.acks { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.ack-form { display: inline-flex; align-items: center; margin: 0; }
.reply { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
.reply .acts { display: flex; align-items: center; gap: 10px; }

          h('div', {}, h('a', { class: 'row__t', href: t.main.href, ...outsideAttrs(t.main) }, item ? item.title : t.label),

function inboxList(state) {

    h('div', { class: 'bar-top' }, h('h1', { tabindex: '-1' }, 'Inbox'),

/* ── Search: one index, the matching rule, eight kinds in a fixed order ───── */
const KINDS = Object.freeze([
  { code: 'claims', heading: 'Claims' }, { code: 'pull-requests', heading: 'Pull requests' }, { code: 'queue', heading: 'Tickets in the queue' }, { code: 'branches', heading: 'Branches' },
  { code: 'areas', heading: 'Areas' }, { code: 'people', heading: 'People' }, { code: 'conversations', heading: 'Conversations' }, { code: 'slots', heading: 'Slots' },
]);
const DOING = Object.freeze({ working: 'working', review: 'in review', silent: 'silent' });
const outOf = (link, name) => (link && link.outside ? { href: link.href, owner: name } : null);
const INDEXERS = Object.freeze({
  claims: () => D.claims.map((c) => { const t = ticketView(c.item); return { title: `${t.title}  ${itemOf(c).title}`, sub: `${c.holder} · ${DOING[activity(c)]} · held ${ago(c.claimedAt)}`, text: claimText(c), number: parseNumbered(t.title)?.number ?? null, here: `#/claims/${c.item}`, out: outOf(t.out, TRACKER_NAME) }; }),
  'pull-requests': () => [
    ...D.claims.flatMap((c) => c.prs.map((p) => { const v = pullRequestView(p); return { title: `PR ${v.title}`, sub: `in review for ${itemOf(c).ref} · ${c.holder}`, text: `pr pull ${v.title} ${itemOf(c).ref} ${itemOf(c).title}`, number: v.number, here: `#/claims/${c.item}`, out: v.out ? { href: v.out.link.href, owner: v.out.name } : null }; })),
    ...D.merged.map((m) => { const v = pullRequestView(m.pr); return { title: `PR ${v.title}`, sub: `merged · moved the base under ${plural(m.claims.length, 'claim')}`, text: `pr pull merged ${v.title}`, number: v.number, here: v.main.href, out: v.out ? { href: v.out.link.href, owner: v.out.name } : null }; }),
  ],
  queue: () => D.queue.map((q) => { const item = ITEMS.get(q.item), t = ticketView(q.item); return { title: `${t.title}  ${item.title}`, sub: `${q.reasons ? 'not ready' : 'ready'} · P${item.priority}`, text: [t.title, item.title, ...item.areas].join(' '), number: parseNumbered(t.title)?.number ?? null, here: `#/queue/${q.item}`, out: outOf(t.out, TRACKER_NAME) }; }),
  branches: () => {
    const seen = [];
    for (const c of D.claims) for (const b of c.branches) { const at = seen.find((s) => s.repo === b.repo && s.name === b.name); if (at) at.tickets.push(itemOf(c).ref); else seen.push({ ...b, tickets: [itemOf(c).ref] }); }
    return seen.map((b) => { const v = branchView(b.repo, b.name); return { title: v.label, sub: `recorded on ${b.tickets.join(', ')}`, text: `branch ${b.repo} ${v.label}`, number: null, here: `#/claims?q=${encodeURIComponent(v.label)}`, out: outOf(v.main, FORGE_NAME) }; });
  },
  areas: () => [...AREAS.keys()].map((full) => { const holding = holdersOf(full); return { title: full, sub: holding.length ? `held by ${holding[0].holder} for ${holding.map((c) => itemOf(c).ref).join(', ')}` : 'free', text: [`area ${full}`, ...AREAS.get(full).paths].join(' '), number: null, here: areaView(full).href, out: null }; }),
  people: () => D.members.map((m) => ({ title: m, sub: plural(D.claims.filter((c) => c.holder === m).length, 'claim'), text: `person ${m}`, number: null, here: personView(m).href, out: null })),
  conversations: () => [...D.threads].sort(newestFirst).map((t) => { const s = summaryOf(t); return { title: plainText(s.subject.subject), sub: `${t.author ?? 'dibs'} to ${t.to === null ? 'everyone' : t.to.join(', ')} · ${clock(s.last)}`, text: s.text, number: null, here: s.subject.href, out: null }; }),
  slots: () => D.slots.map((slot) => ({ title: slot.name, sub: slot.holder ? `held by ${slot.holder}` : 'free', text: `slot ${slot.name} ${slot.note ?? ''}`, number: null, here: `#/?slot=${encodeURIComponent(slot.name)}`, out: null })),

function rank(query, cap) {

  return KINDS.map((kind) => {
    const hits = INDEXERS[kind.code]().filter((e) => matches(query, e.text)).sort((a, b) => Number(numbered(b)) - Number(numbered(a)));
    return { kind, leads: hits.length > 0 && numbered(hits[0]), hits: hits.slice(0, cap), more: Math.max(0, hits.length - cap) };
  }).filter((g) => g.hits.length > 0).sort((a, b) => Number(b.leads) - Number(a.leads));

const searchHint = () => document.querySelector('template[data-search-hint]').content.cloneNode(true);
function results(query, palette) {

  let n = 0;
  return frag(groups.map((g) => {
    const hits = g.hits.map((hit) => {
      n += 1;
      return h('div', { class: 'pal__row', 'data-hit': true, ...(palette ? { role: 'option', id: `hit-${n}`, 'aria-selected': 'false' } : {}) },
        h('a', { href: hit.here, 'data-hit-here': true }, h('div', { class: 't' }, hit.title), h('div', { class: 'u' }, hit.sub)),
        hit.out && h('a', { class: 'ext', href: hit.out.href, target: '_blank', rel: 'noopener noreferrer', 'data-hit-out': true, 'aria-label': `${hit.title} on ${hit.out.owner}` }, '↗'));

      ? h('div', { role: 'group', 'aria-labelledby': `hits-${g.kind.code}` }, h('div', { class: 'pal__grp label', id: `hits-${g.kind.code}` }, g.kind.heading), hits, tail)

function searchList() {
  const q = R.params.get('q') ?? '';

    h('div', { class: 'bar-top' }, h('h1', { tabindex: '-1' }, 'Search'), h('form', { class: 'search-form', method: 'get', role: 'search', 'data-list-filter': true }, h('input', { class: 'search', type: 'search', name: 'q', value: q, 'aria-label': 'Search everything' }))),

/* ── The screens, each a list and, on four of them, an inspector ───── */
const SCREENS = Object.freeze({
  now: { title: 'Now', state: () => null, list: () => nowScreen(), inspector: null },
  claims: { title: 'Claims', state: claimsState, list: claimsList, inspector: claimInspector },
  queue: { title: 'Queue', state: queueState, list: queueList, inspector: queueInspector },
  areas: { title: 'Areas', state: areasState, list: areasList, inspector: areaInspector },
  inbox: { title: 'Inbox', state: inboxState, list: inboxList, inspector: inboxInspector },
  search: { title: 'Search', state: () => null, list: searchList, inspector: null },

/* ── Rendering, focus and the shell's enhancements ───── */
const app = document.querySelector('.app');
const railEl = document.getElementById('rail');
const mainEl = document.getElementById('main');
const toastEl = document.querySelector('[data-toast]');
const isMac = /mac/i.test(navigator.userAgentData?.platform ?? navigator.platform ?? '');
function relabel(scope) {
  if (isMac) return;
  scope.querySelectorAll('kbd[data-kbd-other]').forEach((kbd) => { kbd.textContent = kbd.getAttribute('data-kbd-other'); });
}
let railOpen = false;
function enhanceRail() {
  const toggle = railEl.querySelector('button[data-rail-toggle]');
  railEl.setAttribute('data-collapsible', 'true');
  railEl.setAttribute('data-open', String(railOpen));
  toggle.hidden = false;
  toggle.setAttribute('aria-expanded', String(railOpen));
  relabel(railEl);
}
let previous = { screen: null, key: null };
const rowLink = (key) => [...mainEl.querySelectorAll('[data-row] a[data-inspect], a[data-row]')].find((a) => parseRoute(a.getAttribute('href')).key === key);
function render() {
  const screen = SCREENS[R.screen];
  const state = screen.state();
  const listScroll = previous.screen === R.screen ? mainEl.querySelector('.pane')?.scrollTop ?? 0 : 0;
  const openSlots = new Set([...railEl.querySelectorAll('details[open]')].map((d) => d.id));
  app.dataset.screen = R.screen;
  railEl.replaceChildren();
  add(railEl, rail());
  if (!R.params.get('slot')) railEl.querySelectorAll('details').forEach((d) => { if (openSlots.has(d.id)) d.open = true; });
  enhanceRail();
  mainEl.className = `main${screen.inspector ? ' split' : ''}`;
  mainEl.replaceChildren();
  add(mainEl, [h('div', { class: 'pane', 'data-region': 'list' }, screen.list(state)), screen.inspector && screen.inspector(state)]);
  mainEl.querySelector('.pane').scrollTop = listScroll;
  mainEl.querySelectorAll('[data-copy-link], [data-copy]').forEach((b) => { b.hidden = false; });
  document.title = `${screen.title} · ${D.project} · dibs`;
  const opened = R.key !== null && R.key !== previous.key && previous.screen === R.screen;
  const closed = R.key === null && previous.key !== null && previous.screen === R.screen;
  if (opened) mainEl.querySelector('[data-inspector-heading]')?.focus({ preventScroll: true });
  else if (closed) (rowLink(previous.key) ?? mainEl.querySelector('h1'))?.focus({ preventScroll: true });
  else if (previous.screen !== null && previous.screen !== R.screen) mainEl.querySelector('h1')?.focus({ preventScroll: true });
  if (R.params.get('slot')) railEl.querySelector('details[open]')?.scrollIntoView({ block: 'nearest' });
  previous = { screen: R.screen, key: R.key };
}
function toast(attribute) {
  toastEl.textContent = toastEl.getAttribute(attribute);
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => { toastEl.textContent = ''; }, 2400);
}
async function copy(text) {
  try { await navigator.clipboard.writeText(text); toast('data-copied'); } catch { toast('data-copy-failed'); }
}

/* ── The palette: its keys, its results, opening a hit here or outside ───── */
const dialog = document.querySelector('dialog[data-palette]');
const palInput = dialog.querySelector('input[data-palette-input]');
const palResults = dialog.querySelector('[data-palette-results]');
let palIndex = 0;
const palHits = () => [...palResults.querySelectorAll('[data-hit]')];
function palSelect(at) {
  palIndex = at;
  const hits = palHits();
  hits.forEach((hit, i) => hit.setAttribute('aria-selected', i === at ? 'true' : 'false'));
  const selected = hits[at];
  if (selected) { palInput.setAttribute('aria-activedescendant', selected.id); selected.scrollIntoView({ block: 'nearest' }); }
  else palInput.removeAttribute('aria-activedescendant');
}
function palShow(text) {
  if (dialog.open) return;
  dialog.showModal();
  palInput.value = text;
  palResults.replaceChildren(results(text, true));
  palSelect(0);
  palInput.focus();
}
const WHILE_OPEN = Object.freeze({
  Escape: () => ({ action: 'close' }),
  ArrowDown: () => ({ action: 'move', index: Math.min(palHits().length - 1, palIndex + 1) }),
  ArrowUp: () => ({ action: 'move', index: Math.max(0, palIndex - 1) }),
  Enter: (command) => (palHits().length > 0 ? { action: command ? 'out' : 'here', index: palIndex } : { action: 'none' }),
});
const PAL_ACTIONS = Object.freeze({
  none: () => false,
  open: () => { palShow(''); return true; },
  close: () => { dialog.close(); return true; },
  move: (step) => { if (step.index >= 0) palSelect(step.index); return true; },
  here: (step) => { const link = palHits()[step.index]?.querySelector('a[data-hit-here]'); if (!link) return false; dialog.close(); location.hash = link.getAttribute('href'); return true; },
  out: (step) => { const link = palHits()[step.index]?.querySelector('a[data-hit-out]'); if (!link) return false; window.open(link.href, '_blank', 'noopener'); return true; },
});
const typingIn = (target) => target instanceof Element && target.closest('input, textarea, select, [contenteditable]:not([contenteditable="false"])') !== null;
function paletteStep(event) {
  const command = event.metaKey || event.ctrlKey;
  if (command && event.key.toLowerCase() === 'k') return { action: dialog.open ? 'close' : 'open' };
  if (!dialog.open) return event.key === '/' && !typingIn(event.target) && !command ? { action: 'open' } : { action: 'none' };
  return Object.hasOwn(WHILE_OPEN, event.key) ? WHILE_OPEN[event.key](command) : { action: 'none' };
}

/* ── Delegated listeners: everything the pages do in place ───── */
document.addEventListener('keydown', (event) => {
  if (event.defaultPrevented || event.isComposing) return;
  const step = paletteStep(event);
  if (PAL_ACTIONS[step.action](step)) { event.preventDefault(); return; }
  if (event.key === 'Escape' && !dialog.open && !typingIn(event.target)) {
    const close = mainEl.querySelector('.insp[data-selected="true"] a.x[data-inspect]');
    if (close) { event.preventDefault(); location.hash = close.getAttribute('href'); }
  }
});
palInput.addEventListener('input', () => { palResults.replaceChildren(results(palInput.value, true)); palSelect(0); });
dialog.addEventListener('click', (event) => { if (event.target === dialog) dialog.close(); });
dialog.addEventListener('close', () => {
  if (dialog.open) return;
  palInput.value = '';
  palResults.replaceChildren(searchHint());
});
app.addEventListener('click', (event) => {
  const target = event.target instanceof Element ? event.target : null;
  if (!target) return;
  const box = target.closest('form[data-search] input[name="q"]');
  if (box) { const text = box.value; box.value = ''; palShow(text); return; }
  const toggle = target.closest('button[data-rail-toggle]');
  if (toggle) { railOpen = !railOpen; enhanceRail(); return; }
  const copyButton = target.closest('button[data-copy]');
  if (copyButton) { copy(copyButton.getAttribute('data-copy')); return; }
  if (target.closest('button[data-copy-link]')) copy(location.href);
});
app.addEventListener('input', (event) => {
  const box = event.target;
  if (box instanceof HTMLInputElement && box.matches('form[data-search] input[name="q"]') && box.value !== '') { const text = box.value; box.value = ''; palShow(text); }
});
document.addEventListener('submit', (event) => {
  const form = event.target;
  if (!(form instanceof HTMLFormElement)) return;
  event.preventDefault();
  if (form.matches('[data-list-filter]')) {
    const params = new URLSearchParams();
    new FormData(form).forEach((value, name) => { if (typeof value === 'string' && value !== '') params.set(name, value); });
    const text = params.toString();
    location.hash = `${SCREEN_PATH[R.screen]}${text ? `?${text}` : ''}`;
  } else if (form.matches('[data-palette-form]')) {
    PAL_ACTIONS.here({ index: palIndex });
  } else if (form.matches('[data-search]')) {
    palShow(new FormData(form).get('q') ?? '');
  } else {
    toast('data-not-sent');
  }
});
window.addEventListener('hashchange', () => { R = parseRoute(location.hash); if (dialog.open) dialog.close(); render(); });
relabel(dialog);
render();
</script>
