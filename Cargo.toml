[workspace]
resolver = "3"
members = [
    "crates/domain",
    "crates/app",
    "crates/store-sqlite",
    "crates/server",
    "crates/client",
    "crates/agent-host",
    "crates/host-claude-code",
    "crates/cli",
    "crates/test-server",
    "xtask",
    "tests/e2e",
]

[workspace.package]
version = "0.1.8"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
repository = "https://github.com/hryvinskyi/dibs"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
